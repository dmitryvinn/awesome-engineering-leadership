name: Check for Broken Links

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lychee link checker
        run: |
          curl -sLO https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz
          tar xzf lychee-x86_64-unknown-linux-gnu.tar.gz
          chmod +x lychee
          sudo mv lychee /usr/local/bin/

      - name: Check links in README.md
        id: lychee
        continue-on-error: true
        run: |
          lychee \
            --no-progress \
            --format markdown \
            --output lychee-report.md \
            --exclude-mail \
            --exclude 'linkedin\.com' \
            --exclude 'twitter\.com' \
            --exclude 'x\.com' \
            --max-retries 3 \
            --timeout 30 \
            --accept 200,204,301,302,403,429 \
            README.md || true

      - name: Check for broken links
        id: broken
        run: |
          if grep -q "🔥 Errors" lychee-report.md 2>/dev/null; then
            echo "has_errors=true" >> $GITHUB_OUTPUT
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update issue with broken links
        if: steps.broken.outputs.has_errors == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT=$(cat lychee-report.md )

          BODY=$(cat <<'ISSUE_BODY'
          ## 🔗 Weekly Broken Link Report

          The automated link checker found broken URLs in README.md.

          <details>
          <summary>Full lychee report</summary>

          ISSUE_BODY
          )
          BODY="${BODY}

          ${REPORT}

          </details>

          ---
          *This issue was automatically created by the [check-links](.github/workflows/check-links.yml) GitHub Action.*"

          # Check if an open issue already exists
          EXISTING=$(gh issue list --label "broken-links" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create \
              --title "🔗 Broken links found in README.md" \
              --body "$BODY" \
              --label "broken-links"
            echo "Created new issue"
          fi

      - name: Summary
        run: |
          if [ -f lychee-report.md ]; then
            echo "## Link Check Results" >> $GITHUB_STEP_SUMMARY
            cat lychee-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ All links are valid" >> $GITHUB_STEP_SUMMARY
          fi
