name: Monthly Freshness Audit

on:
  schedule:
    - cron: '0 9 1 * *'  # 1st of every month at 09:00 UTC
  workflow_dispatch:

jobs:
  freshness-audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        id: lychee
        with:
          args: >-
            --no-progress
            --format markdown
            --output lychee-report.md
            --exclude-mail
            --exclude 'linkedin\.com'
            --exclude 'twitter\.com'
            --exclude 'x\.com'
            --max-retries 5
            --timeout 60
            --accept 200,204,301,302,307,308
            README.md
        continue-on-error: true

      - name: Count issues found
        id: counts
        run: |
          ERRORS=$(grep -c "^\[" lychee-report.md 2>/dev/null || echo "0")
          echo "error_count=$ERRORS" >> $GITHUB_OUTPUT
          if [ "$ERRORS" -gt "0" ]; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update freshness audit issue
        if: steps.counts.outputs.has_issues == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('lychee-report.md', 'utf8');
            const errorCount = '${{ steps.counts.outputs.error_count }}';
            const date = new Date().toISOString().split('T')[0];

            const body = `## 📋 Monthly Freshness Audit — ${date}

            Found **${errorCount}** broken or redirected links in README.md.

            <details>
            <summary>Full lychee report</summary>

            ${report}

            </details>

            ---
            *This issue was automatically created by the [freshness-audit](.github/workflows/freshness-audit.yml) GitHub Action.*`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'freshness-audit',
              state: 'open',
              per_page: 1,
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body,
              });
              console.log(`Updated existing issue #${issues.data[0].number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📋 Freshness Audit — ${date}`,
                body: body,
                labels: ['freshness-audit'],
              });
              console.log('Created new freshness audit issue');
            }

      - name: Summary
        run: |
          echo "## 📋 Freshness Audit Results" >> $GITHUB_STEP_SUMMARY
          if [ -f lychee-report.md ]; then
            cat lychee-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All links are healthy" >> $GITHUB_STEP_SUMMARY
          fi
